<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>間 - AWAi / Between Us</title><style>body{margin:0;background:#050811;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;text-align:center}.wrap{max-width:980px;margin:auto;padding:24px 16px 48px}h1{font-family:serif;font-weight:500;font-size:clamp(36px,8vw,68px);margin:8px 0 4px}.sub{color:#aeb8ca;margin:0 0 22px}.frame{border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 70px rgba(0,0,0,.45)}img{width:100%;height:auto;display:block}.copy{max-width:760px;margin:24px auto 0;text-align:left;line-height:1.9;color:#d8deea}.eyebrow{font-size:12px;letter-spacing:.18em;color:#a9b4c8}</style></head><body><main class='wrap'><div class='eyebrow'>AI ART GRANDPRIX 2026 / THEME: HARMONY</div><h1>間 - AWAi</h1><p class='sub'>Between Us ― 人とAIが咲かせる第三の生命</p><div class='frame'><img src='https://raw.githubusercontent.com/czwaew/-ja-work-app/ai-art-grandprix-2026/ai-art-grandprix/awai-harmony.svg' alt='AI Art GrandPrix 2026 artwork'></div><div class='copy'><p>人間とAIが向き合い、その「間」から新しい創造が生まれる瞬間を表現した作品です。左の人物は感情・生命・直感を、右の透明な存在は情報・論理・計算を象徴しています。両者は同化するのではなく、違いを保ったまま中央の白い花を共に咲かせています。この花は、人間だけでもAIだけでも生まれなかった第三の創造の象徴です。テーマ「調和」を、同じになることではなく、異なる存在が互いを受け入れ、その違いから新しい価値を生み出すこととして描きました。</p></div></main></body></html>
